[package]
name = "mev-streamer-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-sdk = "2.2"
bs58 = "0.5"
bincode = "1.3"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
